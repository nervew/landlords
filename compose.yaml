name: landlords

services:
  db:
    image: postgres:17.10-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: landlords
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env.docker}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d landlords"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  db-init:
    build:
      context: .
      target: db-tools
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_ADMIN_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      DATABASE_ADMIN_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/landlords
      DATABASE_URL: postgresql://landlords_app:${APP_DATABASE_PASSWORD}@db:5432/landlords
      APP_DATABASE_NAME: landlords
      APP_DATABASE_USER: landlords_app
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Define APP_DATABASE_PASSWORD in .env.docker}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Define SEED_ADMIN_PASSWORD in .env.docker}
      SEED_MEMBER_PASSWORD: ${SEED_MEMBER_PASSWORD:?Define SEED_MEMBER_PASSWORD in .env.docker}

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    init: true
    depends_on:
      db-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://landlords_app:${APP_DATABASE_PASSWORD}@db:5432/landlords
      BETTER_AUTH_URL: ${SITE_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Define BETTER_AUTH_SECRET in .env.docker}
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
      EMAIL_DELIVERY_MODE: smtp
      SMTP_URL: smtp://mailpit:1025
      EMAIL_FROM: ${EMAIL_FROM:-Raiz de Pueblo <no-responder@landlords.local>}
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(response=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:

